<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>B&amp;M Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: sheet-like cutoff cards on a cool neutral ground; one header, five pages, one Quick Add button. */
:root{
  --bg:#eff3f9; --surface:#ffffff; --surface2:#f5f8fc; --ink:#17202e; --muted:#586479; --line:#d9e1ed;
  --blue:#2563c9; --blue-soft:#dce8fb; --blue-ink:#143c80;
  --green:#12703f; --green-soft:#d6f0e1;
  --red:#b5302a; --red-soft:#fadfdc;
  --amber:#9c5800; --amber-soft:#ffe8b8; --yellow:#ffe14a; --yellow-ink:#2b2300;
  --needs:#2f65ad; --needs-soft:#e0eaf8; --wants:#a83c72; --wants-soft:#f8e1ec; --sav:#9c5800; --sav-soft:#fff0cc;
  --cut1:#d3e2fb; --cut2:#f3dbe6; --cut3:#d9eedd; --cut4:#fbe9c4;
  --focus:#1d4fd8; --shadow:0 1px 2px rgba(20,35,60,.06),0 4px 14px rgba(20,35,60,.05);
  --display:'Bricolage Grotesque','IBM Plex Sans',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1420; --surface:#161e2e; --surface2:#1b2538; --ink:#e7ecf6; --muted:#9aa7bf; --line:#2a364d;
  --blue:#6ea2ff; --blue-soft:#1d2f52; --blue-ink:#c6dbff;
  --green:#5fd195; --green-soft:#12392a; --red:#ff8d84; --red-soft:#3f1d1b;
  --amber:#ffc15a; --amber-soft:#40300f; --yellow:#f2cf2f; --yellow-ink:#241d00;
  --needs:#7eaaf0; --needs-soft:#1b2c4a; --wants:#f08bb8; --wants-soft:#41202f; --sav:#ffc15a; --sav-soft:#3b2d10;
  --cut1:#1f3358; --cut2:#44253a; --cut3:#1c3b2c; --cut4:#473512;
  --focus:#8bb4ff; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1420; --surface:#161e2e; --surface2:#1b2538; --ink:#e7ecf6; --muted:#9aa7bf; --line:#2a364d;
  --blue:#6ea2ff; --blue-soft:#1d2f52; --blue-ink:#c6dbff;
  --green:#5fd195; --green-soft:#12392a; --red:#ff8d84; --red-soft:#3f1d1b;
  --amber:#ffc15a; --amber-soft:#40300f; --yellow:#f2cf2f; --yellow-ink:#241d00;
  --needs:#7eaaf0; --needs-soft:#1b2c4a; --wants:#f08bb8; --wants-soft:#41202f; --sav:#ffc15a; --sav-soft:#3b2d10;
  --cut1:#1f3358; --cut2:#44253a; --cut3:#1c3b2c; --cut4:#473512;
  --focus:#8bb4ff; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:1.65rem;line-height:1.15} h2{font-size:1.15rem} h3{font-size:1.05rem}
p{margin:0}
.num,.money{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:14px 120px}

/* header */
.top{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:6px 14px}
.brand{font-family:var(--display);font-weight:700;font-size:1.2rem;display:flex;align-items:center;gap:9px;margin-right:auto}
.brand i{width:30px;height:30px;border-radius:8px;background:var(--yellow);color:var(--yellow-ink);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:1rem}
.monthbar{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.monthbar b{min-width:132px;text-align:center;font-family:var(--display);font-size:1rem}
.ibtn{border:0;background:transparent;border-radius:8px;width:34px;height:34px;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted)}
.ibtn:hover{background:var(--surface2);color:var(--ink)}
.ibtn svg{width:18px;height:18px}
.link{border:0;background:none;color:var(--blue);cursor:pointer;padding:4px 6px;font-weight:500}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav a{padding:8px 13px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:500}
.nav a:hover{background:var(--surface);color:var(--ink)}
.nav a{transition:background-color .18s ease,color .18s ease,transform .18s ease}
.nav a:hover{transform:translateY(-1px)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav a.settings-link{width:38px;height:38px;padding:8px;display:grid;place-items:center}
.nav a.settings-link svg{display:block;width:21px;height:21px}
.nav a.settings-link:hover svg{transform:rotate(24deg)}
.nav a.settings-link svg{transition:transform .25s ease}
.fab{position:fixed;z-index:20;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;border:0;background:var(--blue);color:#fff;font-weight:600;border-radius:999px;padding:13px 20px 13px 16px;box-shadow:0 6px 20px rgba(20,60,140,.35);cursor:pointer}
:root[data-theme="dark"] .fab{color:#06162f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fab{color:#06162f}}
.fab svg{width:20px;height:20px}
.fab{transition:transform .18s ease,box-shadow .18s ease}
.fab:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(20,60,140,.4)}
.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--amber-soft);color:var(--ink);border:1px solid var(--amber);border-radius:12px;padding:11px 14px;margin-bottom:14px}
.banner b{color:var(--amber)}
.banner .sp{flex:1;min-width:220px}
.note{background:var(--blue-soft);color:var(--blue-ink);border-radius:10px;padding:9px 12px;font-size:.9rem;margin-bottom:14px}

/* generic */
.pagehead{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:8px 16px;margin-bottom:14px}
.sub{color:var(--muted);font-size:.92rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.pad{padding:16px}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));align-items:start}
.g-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));align-items:start}
.kpi{padding:14px 15px;display:flex;flex-direction:column;gap:2px}
.kpi small{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.kpi .v{font-family:var(--display);font-size:1.5rem;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{color:var(--muted);font-size:.85rem}
.kpi.total{background:var(--yellow);border-color:transparent;color:var(--yellow-ink)}
.kpi.total small,.kpi.total .s{color:var(--yellow-ink);opacity:.8}
.pos{color:var(--green)} .neg{color:var(--red)} .blue{color:var(--blue)} .amber{color:var(--amber)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 8px}
.empty{padding:22px 16px;color:var(--muted);text-align:center}
.empty .btn{margin-top:10px}

/* buttons & forms */
.btn{text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface2)}
.btn{transition:transform .15s ease,background-color .15s ease,box-shadow .15s ease}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#06162f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#06162f}}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.danger.armed{background:var(--red);color:#fff}
.btn.sm{padding:5px 10px;font-size:.88rem}
.btn svg{width:16px;height:16px}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:500;font-size:.9rem;min-width:0}
.in,select.in{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;width:100%;min-width:0;transition:border-color .18s ease,box-shadow .18s ease,background-color .18s ease}
.in:focus{outline:3px solid var(--focus);outline-offset:0}
.amt{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding-left:11px}
.amt:focus-within{outline:3px solid var(--focus)}
.amt span{color:var(--muted)}
.amt input{border:0;background:transparent;padding:9px 11px 9px 6px;width:100%;min-width:0;outline:0;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);position:relative}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;padding:8px 14px;font-weight:500;color:var(--muted)}
.seg input:checked+span{background:var(--ink);color:var(--bg)}
.seg input:focus-visible+span{outline:3px solid var(--focus);outline-offset:-3px}
.seg.paid input[value="paid"]:checked+span{background:var(--green);color:#fff}
.seg.paid input[value="unpaid"]:checked+span{background:var(--red);color:#fff}
:root[data-theme="dark"] .seg.paid input:checked+span{color:#06150d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg.paid input:checked+span{color:#06150d}}
.err{color:var(--red);background:var(--red-soft);border-radius:8px;padding:8px 11px;font-size:.9rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}

/* cutoff cards */
.cut-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-radius:13px 13px 0 0}
.cut-h h3{font-size:1.5rem}
.cut-h small{display:block;color:var(--muted);font-size:.82rem}
.cut-h .big{font-family:var(--display);font-weight:700;font-size:1.65rem;font-variant-numeric:tabular-nums}
.cut0 .cut-h{background:var(--cut1)} .cut1 .cut-h{background:var(--cut2)} .cut2 .cut-h{background:var(--cut3)} .cut3 .cut-h{background:var(--cut4)}
.inc{padding:8px 16px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.inc .r{display:flex;align-items:center;gap:8px;padding:3px 0}
.inc .r .n{flex:1;min-width:0;overflow-wrap:anywhere}
.grp{border-bottom:1px solid var(--line)}
.grp-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 10px;padding:9px 16px;background:var(--blue-soft);color:var(--blue-ink);font-weight:600}
.grp-h .a{font-variant-numeric:tabular-nums}
.gchip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:600}
.gchip.needs{background:var(--needs-soft);color:var(--needs)} .gchip.wants{background:var(--wants-soft);color:var(--wants)} .gchip.savings{background:var(--sav-soft);color:var(--sav)}
.meter{padding:8px 16px 4px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.bar.over i{background:var(--red)}
.bar.sv i{background:var(--amber)}
.meter p{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.84rem;color:var(--muted);margin-top:5px}
.rows{list-style:none;margin:0;padding:2px 8px}
.rows li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px}
.rows li:hover{background:var(--surface2)}
.rows .n{flex:1;min-width:0;overflow-wrap:anywhere}
.rows .n small{display:block;color:var(--muted);font-size:.78rem}
.rows .m{font-variant-numeric:tabular-nums;text-align:right;min-width:92px}
.chip{border:1.5px solid;border-radius:999px;padding:3px 11px 3px 8px;font-size:.82rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;background:transparent;min-width:84px;justify-content:center}
.chip svg{width:13px;height:13px}
.chip.paid{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.chip.unpaid{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.grp-f{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 16px 10px}
.tot{font-weight:600;font-variant-numeric:tabular-nums}
.tot.sv{color:var(--amber)}
.remain{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 16px;border-radius:0 0 13px 13px;background:var(--blue);color:#fff;font-weight:600}
:root[data-theme="dark"] .remain{color:#06162f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .remain{color:#06162f}}
.remain.neg{background:var(--red);color:#fff}
:root[data-theme="dark"] .remain.neg{color:#2a0805}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .remain.neg{color:#2a0805}}
.remain b{font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.tabs{display:inline-flex;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:3px}
.tabs button{border:0;background:transparent;border-radius:8px;padding:6px 14px;font-weight:500;color:var(--muted);cursor:pointer;transition:background-color .18s ease,color .18s ease,box-shadow .18s ease,transform .18s ease}
.tabs button:hover{transform:translateY(-1px);color:var(--ink)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tabs button[aria-pressed="true"]:active{transform:scale(.97)}
.entry-context{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:11px;background:var(--blue-soft);color:var(--blue-ink);font-size:.88rem}
.entry-context strong{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.entry-tabs{display:flex;flex-direction:column;gap:7px}
.entry-tabs small{display:block;color:var(--muted);font-size:.76rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.entry-tab-group{display:flex;flex-wrap:wrap;gap:4px}
.payroll-tag{display:inline-flex;align-items:center;gap:4px;margin-top:3px;padding:2px 7px;border-radius:999px;background:var(--green-soft);color:var(--green);font-size:.72rem;font-weight:600}

/* tables */
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
thead th{background:var(--surface2);font-weight:600;font-size:.85rem}
thead th.mh{background:var(--ink);color:var(--bg)}
tfoot td{font-weight:600;background:var(--amber-soft)}
tfoot td:first-child{background:var(--amber-soft)}
td.dim{color:var(--muted)}
tr.hl td{background:var(--surface2);font-weight:600}
tr.hl td:first-child{background:var(--surface2)}

/* accounts */
.acct{padding:16px;display:flex;flex-direction:column;gap:8px;transition:transform .18s ease,box-shadow .18s ease}
.acct:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(20,35,60,.1)}
.acct .nm{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kind{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.bal{font-family:var(--display);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums}
.em{list-style:none;margin:0;padding:8px 0 0;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:3px;font-size:.9rem}
.em li{display:flex;justify-content:space-between;gap:8px}
.em li span:first-child{color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tx{list-style:none;margin:0;padding:0 8px 8px}
.tx li{display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px}
.tx li:hover{background:var(--surface2)}
.tx .d{width:62px;color:var(--muted);font-size:.85rem}
.tx .n{flex:1;min-width:0;overflow-wrap:anywhere}
.tx .n small{display:block;color:var(--muted)}
.tx .m{font-variant-numeric:tabular-nums;font-weight:600}

/* charts */
.chart{width:100%;min-height:200px}
.chart svg{display:block;max-width:100%}
.ch-t{fill:var(--muted);font-size:11.5px;font-family:var(--body)}
.ch-g{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:0 16px 12px;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* settings */
.set-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .in{width:96px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.cat{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 11px;background:var(--surface2)}
.cat button{border:0;background:none;cursor:pointer;color:var(--muted);width:24px;height:24px;border-radius:50%}
.cat button:hover{color:var(--red)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-weight:500;font-size:.9rem}
.pill b{font-family:var(--display)}
.goal{padding:10px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.goal:first-of-type{border-top:0}
.goal .t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.goal .t b{flex:1;min-width:0;overflow-wrap:anywhere}
.goal .bar{height:10px}
.goal .bar i{background:var(--amber)}
.goal.done .bar i{background:var(--green)}
.badge{display:inline-flex;align-items:center;gap:4px;background:var(--green-soft);color:var(--green);border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600}
.badge svg{width:12px;height:12px}
.welcome{max-width:640px;margin:18px auto}
.welcome .grid{margin-top:6px}
.profiles{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-bottom:12px}
.profiles[hidden]{display:none}
.pchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 14px 4px 4px;font-weight:600;cursor:pointer}
.pchip i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.8rem;background:var(--blue-soft);color:var(--blue-ink)}
.pchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pchip.on i{background:var(--yellow);color:var(--yellow-ink)}
.pnew{border:1.5px dashed var(--muted);background:transparent;color:var(--blue);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.pnew svg{width:14px;height:14px}
.pill svg{width:18px;height:18px;flex:none}
.acct.has-bg{color:#fff;border-color:transparent}
.acct.has-bg .kind,.acct.has-bg .em li span:first-child{color:rgba(255,255,255,.84)}
.acct.has-bg .ibtn{color:#fff}
.acct.has-bg .ibtn:hover{background:rgba(255,255,255,.2);color:#fff}
.acct.has-bg .em{border-top-color:rgba(255,255,255,.38)}
.acct .tools{display:flex;gap:2px}
.bgprev{border-radius:14px;padding:16px;min-height:112px;display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.bgprev.has-bg{color:#fff;border-color:transparent}

.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:64px;height:40px;border-radius:9px;border:0;cursor:pointer;color:#fff;font-weight:600;font-size:.8rem;box-shadow:0 0 0 1px var(--line)}

}

<script>
(function(){
'use strict';
var LS_DATA='payday-ledger-v1', LS_UI='payday-ledger-ui';
var GROUPS=[{id:'needs',label:'Needs'},{id:'wants',label:'Wants'},{id:'savings',label:'Savings'}];
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var DEF={cutoffs:[{id:'c1',day:15},{id:'c2',day:30}],ruling:{needs:50,wants:30,savings:20},confirmedTotal:null,
  cats:{needs:['Motor','Masteral','Allowance','Gas','Lagak','Kuryente'],wants:['Tiktok'],savings:['Gala / Emergency']}};

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return String(n).padStart(2,'0')}
function r2(x){return Math.round((x+Number.EPSILON)*100)/100}
function sum(a,f){return r2(a.reduce(function(t,x){return t+(f?f(x):x.amount)},0))}
function clone(o){return JSON.parse(JSON.stringify(o))}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function money(n){n=r2(Number(n)||0);var s='₱'+Math.abs(n).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});return n<0?'−'+s:s}
function parseAmount(v,allowZero){var s=String(v==null?'':v).replace(/[₱,\s]/g,'');if(!s||!/^\d*\.?\d+$/.test(s))return null;var n=Number(s);if(!isFinite(n)||n>1e9||n<0||(n===0&&!allowZero))return null;return r2(n)}
function ym(y,m){return y+'-'+pad(m)}
function curYM(){var d=new Date();return ym(d.getFullYear(),d.getMonth()+1)}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function shiftYM(k,n){var p=k.split('-').map(Number),d=new Date(p[0],p[1]-1+n,1);return ym(d.getFullYear(),d.getMonth()+1)}
function ymLabel(k,short){var p=k.split('-').map(Number);return (short?MONTHS[p[1]-1].slice(0,3):MONTHS[p[1]-1])+' '+p[0]}
function daysIn(k){var p=k.split('-').map(Number);return new Date(p[0],p[1],0).getDate()}
function cutoffDate(k,day){return k+'-'+pad(Math.min(day,daysIn(k)))}
function ordinal(n){var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function shortDate(d){var p=d.split('-').map(Number);return MONTHS[p[1]-1].slice(0,3)+' '+p[2]}
function validYM(s){return /^\d{4}-(0[1-9]|1[0-2])$/.test(s)}
function validDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(new Date(s+'T00:00:00').getTime())}

var ICON={
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  image:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4.5 3.5 3L16 12l4 4"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9.5" rx="2.2"/><path d="M8.5 11V8a3.5 3.5 0 017 0v3"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>'
};

/* ---------- state ---------- */
var S={settings:normSettings(null),accounts:{},months:{},tx:{},goals:{}};
var ui={route:'dashboard',month:curYM(),cutoff:null,mode:'pending',loading:true,locked:false,slow:false,theme:'system',why:''};
var BASE='',metaReady=false,downloadsNs=null,UID='',subs=[],gen=0;
var db=null, charts=[];

function normSettings(r){
  var d=clone(DEF); if(!r) return d;
  if(Array.isArray(r.cutoffs)&&r.cutoffs.length){
    var cs=r.cutoffs.filter(function(x){return x&&x.id&&x.day>=1&&x.day<=31}).map(function(x){return{id:String(x.id),day:Math.round(x.day)}});
    if(cs.length) d.cutoffs=cs.slice(0,4);
  }
  d.cutoffs.sort(function(a,b){return a.day-b.day});
  if(r.ruling) ['needs','wants','savings'].forEach(function(g){var v=Number(r.ruling[g]);if(isFinite(v)&&v>=0&&v<=100)d.ruling[g]=v});
  d.confirmedTotal=(typeof r.confirmedTotal==='number')?r.confirmedTotal:null;
  if(r.cats) ['needs','wants','savings'].forEach(function(g){if(Array.isArray(r.cats[g]))d.cats[g]=r.cats[g].map(String).slice(0,80)});
  return d;
}

/* ---------- persistence ---------- */
var queues={};
function persist(path,op){
  if(!db){saveLocal();return}
  var q=queues[path]||(queues[path]={busy:false,next:null});
  q.next=op; if(q.busy) return;
  (async function run(){
    q.busy=true;
    while(q.next){
      var o=q.next;q.next=null;
      try{ if(o.del) await db.doc(BASE+'/'+path).delete(); else await db.doc(BASE+'/'+path).set(o.data); }
      catch(e){ toast('Could not save that change. Check your connection and try again.'); }
    }
    q.busy=false;
  })();
}
function setDoc(kind,id,data){
  data=clone(data);
  if(kind==='config') S.settings=normSettings(data); else S[kind][id]=data;
  persist(kind+'/'+id,{data:data}); scheduleRender();
}
function delDoc(kind,id){delete S[kind][id];persist(kind+'/'+id,{del:true});scheduleRender()}
function saveSettings(){setDoc('config','settings',S.settings)}
function saveLocal(){try{localStorage.setItem(dataKey(),JSON.stringify({settings:S.settings,accounts:S.accounts,months:S.months,tx:S.tx,goals:S.goals}))}catch(e){}}
function loadLocal(){
  var raw=null; try{raw=localStorage.getItem(dataKey())}catch(e){}
  if(raw){try{var o=JSON.parse(raw);S.settings=normSettings(o.settings);S.accounts=o.accounts||{};S.months=o.months||{};S.tx=o.tx||{};S.goals=o.goals||{}}catch(e){}}
}
/* ---------- budgets (local mode) ---------- */
var LS_PROF='payday-ledger-profiles',P={list:[],active:null};
var LS_ACTIVE='payday-ledger-active';
function metaPath(){return 'data/users/'+UID+'/meta'}
function baseFor(id){return 'data/users/'+UID+'/'+(id==='p1'?'ledger':'ledger-'+id)}
function saveProfiles(){
  if(ui.mode==='cloud'){
    try{localStorage.setItem(LS_ACTIVE,P.active)}catch(e){}
    db.doc(metaPath()).set({list:clone(P.list)}).catch(function(){toast('Could not save your budgets list. Check your connection.')});
  }else{try{localStorage.setItem(LS_PROF,JSON.stringify(P))}catch(e){}}
}
function dataKey(){return LS_DATA+':'+(P.active||'p1')}
function loadProfiles(){
  try{var o=JSON.parse(localStorage.getItem(LS_PROF)||'null');if(o&&Array.isArray(o.list)){P.list=o.list.filter(function(x){return x&&typeof x.id==='string'&&typeof x.name==='string'}).slice(0,8);P.active=o.active}}catch(e){}
  if(!P.list.length){
    P.list=[{id:'p1',name:'My Budget'}];P.active='p1';
    try{var old=localStorage.getItem(LS_DATA);if(old&&!localStorage.getItem(LS_DATA+':p1'))localStorage.setItem(LS_DATA+':p1',old)}catch(e){}
    saveProfiles();
  }
  if(!P.list.some(function(x){return x.id===P.active}))P.active=P.list[0].id;
}
function resetState(){S.settings=normSettings(null);S.accounts={};S.months={};S.tx={};S.goals={}}
function activeProfile(){return P.list.filter(function(x){return x.id===P.active})[0]||P.list[0]}
function activate(id){
  P.active=id;ui.cutoff=null;resetState();
  if(ui.mode==='cloud'){try{localStorage.setItem(LS_ACTIVE,id)}catch(e){}BASE=baseFor(id);ui.loading=true;subscribe()}
  else{saveProfiles();loadLocal()}
  render();
}
function switchProfile(id){
  if(id===P.active)return;
  var x=P.list.filter(function(q){return q.id===id})[0];
  if(x&&isPw(x.pw)&&!unlocked[id]){askUnlock(x);return}
  activate(id);
}
var swCtx=null;
function askUnlock(x){
  swCtx={id:x.id};
  openModal('<form id="switch-form" novalidate><p class="sub">This budget is protected. Enter its password to open it.</p><label class="f">Password<input class="in" id="s-pw" type="password" autocomplete="current-password"></label><div class="err" id="f-err" role="alert" hidden></div><div class="acts"><button type="button" class="btn" data-act="close">Cancel</button><button type="submit" class="btn pri">Unlock</button></div></form>','Unlock '+x.name);
}
async function submitSwitch(){
  var x=P.list.filter(function(q){return q.id===swCtx.id})[0];if(!x||!isPw(x.pw)){closeModal();return}
  if(Date.now()<lockUntil)return formErr('Too many tries. Wait '+Math.ceil((lockUntil-Date.now())/1000)+' seconds.','s-pw');
  if(!cryptoOk())return formErr('Passwords need a secure (https) page.');
  var ok=false;try{ok=await checkPw(val('s-pw'),x.pw)}catch(e){}
  if(!ok){fails++;if(fails>=5){lockUntil=Date.now()+30000;fails=0}return formErr('That password is not right.','s-pw')}
  fails=0;unlocked[x.id]=1;saveUnlocked();closeModal();activate(x.id);
}
function renderProfiles(){
  var el=$('#profiles');
  if(ui.locked||!P.list.length||(ui.mode!=='local'&&ui.mode!=='cloud')){el.hidden=true;el.innerHTML='';return}
  el.hidden=false;
  el.innerHTML='<span class="sub">Budget of</span>'+P.list.map(function(x){return '<button class="pchip'+(x.id===P.active?' on':'')+'" data-act="prof-switch" data-id="'+esc(x.id)+'" aria-pressed="'+(x.id===P.active)+'"><i aria-hidden="true">'+esc((x.name.trim()[0]||'?').toUpperCase())+'</i>'+esc(x.name)+(isPw(x.pw)?ICON.lock:'')+'</button>'}).join('')
    +'<button class="ibtn" data-act="prof-edit" aria-label="Rename or delete '+esc(activeProfile().name)+'">'+ICON.edit+'</button>'
    +(P.list.length<8?'<button class="pnew" data-act="prof-add">'+ICON.plus+'Create account</button>':'');
}
/* ---------- optional budget password ---------- */
var unlocked={};try{unlocked=JSON.parse(sessionStorage.getItem('payday-ledger-unlocked')||'{}')||{}}catch(e){unlocked={}}
function saveUnlocked(){try{sessionStorage.setItem('payday-ledger-unlocked',JSON.stringify(unlocked))}catch(e){}}
function isPw(r){return !!(r&&typeof r.s==='string'&&typeof r.h==='string'&&Number.isInteger(r.i)&&r.i>=1000)}
function isLocked(){var a=activeProfile();return !!(a&&isPw(a.pw)&&!unlocked[a.id])}
function b64e(u){var t='';for(var i=0;i<u.length;i++)t+=String.fromCharCode(u[i]);return btoa(t)}
function b64d(x){var t=atob(x),u=new Uint8Array(t.length);for(var i=0;i<t.length;i++)u[i]=t.charCodeAt(i);return u}
function cryptoOk(){return !!(window.crypto&&crypto.subtle&&crypto.getRandomValues)}
async function pwHash(pw,saltB64,iter){
  var key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  var bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64d(saltB64),iterations:iter},key,256);
  return b64e(new Uint8Array(bits));
}
async function makePw(pw){var s=b64e(crypto.getRandomValues(new Uint8Array(16))),i=150000;return{s:s,i:i,h:await pwHash(pw,s,i)}}
async function checkPw(pw,rec){return (await pwHash(pw,rec.s,rec.i))===rec.h}
function pwFields(mode){
  if(mode==='set'||mode==='change')
    return '<div class="pwbox">'+(mode==='change'?'<label class="f">Current password<input class="in" id="p-cur" type="password" autocomplete="current-password"></label>':'')
      +'<label class="f">'+(mode==='change'?'New password':'Password')+'<input class="in" id="p-pw" type="password" autocomplete="new-password" minlength="4" maxlength="64"></label><label class="f">Confirm password<input class="in" id="p-pw2" type="password" autocomplete="new-password" maxlength="64"></label>'
      +'<p class="sub">At least 4 characters. If you forget it, this budget cannot be opened again, only erased. Keep a backup file from Settings.</p><div><button type="button" class="btn sm" data-act="pw-mode" data-m="">Skip the password</button></div></div>';
  if(mode==='remove')
    return '<div class="pwbox"><label class="f">Current password<input class="in" id="p-cur" type="password" autocomplete="current-password"></label><p class="sub">Press Save to remove the password from this budget.</p><div><button type="button" class="btn sm" data-act="pw-mode" data-m="">Keep the password</button></div></div>';
  return '';
}
function pwSection(a){
  if(a&&isPw(a.pw))return '<div class="pwstate">'+ICON.lock+'<b>Password is on</b><button type="button" class="btn sm" data-act="pw-mode" data-m="change">Change</button><button type="button" class="btn sm" data-act="pw-mode" data-m="remove">Remove</button></div>';
  return '<button type="button" class="btn sm" data-act="pw-mode" data-m="set" style="align-self:flex-start">'+ICON.lock+'Set a password (optional)</button>';
}
function lockScreen(){
  var a=activeProfile();
  return '<section class="card pad lockbox"><h1>'+ICON.lock+esc(a.name)+' is locked</h1><p class="sub">Enter the password to open this budget.</p><form id="unlock-form" novalidate><label class="f">Password<input class="in" id="u-pw" type="password" autocomplete="current-password" autofocus></label><div class="err" id="f-err" role="alert" hidden></div><button class="btn pri" type="submit">Unlock</button></form><p class="sub">Forgot it? <button class="link" data-act="prof-erase" style="padding:0">Erase this budget</button> (this deletes its data).</p></section>';
}
var fails=0,lockUntil=0;
async function submitUnlock(){
  var a=activeProfile();if(!a||!isPw(a.pw))return;
  if(Date.now()<lockUntil)return formErr('Too many tries. Wait '+Math.ceil((lockUntil-Date.now())/1000)+' seconds.','u-pw');
  if(!cryptoOk())return formErr('Passwords need a secure (https) page.');
  var ok=false;try{ok=await checkPw(val('u-pw'),a.pw)}catch(e){}
  if(!ok){fails++;if(fails>=5){lockUntil=Date.now()+30000;fails=0}return formErr('That password is not right.','u-pw')}
  fails=0;unlocked[a.id]=1;saveUnlocked();render();

async function submitProfile(){

  if(mode){

        if(!(cur&&isPw(cur.pw)&&await checkPw(val('p-cur'),cur.pw)))return formErr('The current password is not right.','p-cur');

  }

    if(rec)unlocked[profCtx.id]=1;saveUnlocked();saveProfiles();closeModal();render();toast(rec===null?'Password removed':rec?'Password saved':'Saved');
  }else{
    var id='p'+Date.now().toString(36),np={id:id,name:n};if(rec)np.pw=rec;P.list.push(np);if(rec){unlocked[id]=1;saveUnlocked()}
    closeModal();activate(id);saveProfiles();toast(n+' created'+(rec?' and locked':''));

function cleanBg(b){if(b&&b.type==='color'&&BG[b.id])return{type:'color',id:b.id};if(b&&b.type==='photo'&&validPhoto(b.data))return{type:'photo',data:b.data};return null}

function resizePhoto(file){

    if(!/^image\//.test(file.type)||file.size>20e6)return rej();
    var u=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var W=640,H=360,c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext('2d'),r=Math.max(W/im.width,H/im.height),w=im.width*r,h=im.height*r;
      x.drawImage(im,(W-w)/2,(H-h)/2,w,h);URL.revokeObjectURL(u);
      var q=.78,d=c.toDataURL('image/jpeg',q);while(d.length>180000&&q>.35){q-=.1;d=c.toDataURL('image/jpeg',q)}

/* ---------- calculations ---------- */
function getMonth(k){var m=S.months[k];return{income:(m&&m.income)||[],items:(m&&m.items)||[]}}
function calcCutoff(k,cid){
  var m=getMonth(k),r=S.settings.ruling;
  var inc=sum(m.income.filter(function(x){return x.cutoff===cid&&x.kind!=='deduction'}));
  var ded=sum(m.income.filter(function(x){return x.cutoff===cid&&x.kind==='deduction'}));
  var net=r2(inc-ded),g={},planned=0,paid=0;
  GROUPS.forEach(function(G){
    var items=m.items.filter(function(i){return i.cutoff===cid&&i.group===G.id});
    var p=sum(items),pd=sum(items.filter(function(i){return i.paid})),al=r2(net*(r[G.id]||0)/100);
    g[G.id]={items:items,planned:p,paid:pd,alloc:al,available:r2(al-p)};planned+=p;paid+=pd;
  });
  planned=r2(planned);paid=r2(paid);
  return{inc:inc,ded:ded,net:net,g:g,planned:planned,paid:paid,unpaid:r2(planned-paid),remain:r2(net-planned)};
}
function calcMonth(k){
  var t={inc:0,ded:0,net:0,g:{},planned:0,paid:0,unpaid:0,remain:0};
  GROUPS.forEach(function(G){t.g[G.id]={planned:0,paid:0,alloc:0,available:0}});
  S.settings.cutoffs.forEach(function(c){
    var x=calcCutoff(k,c.id);
    ['inc','ded','net','planned','paid','unpaid','remain'].forEach(function(f){t[f]=r2(t[f]+x[f])});
    GROUPS.forEach(function(G){['planned','paid','alloc','available'].forEach(function(f){t.g[G.id][f]=r2(t.g[G.id][f]+x.g[G.id][f])})});
  });
  return t;
}
function allTx(){return Object.keys(S.tx).map(function(id){var t=S.tx[id];return{id:id,account:t.account,toAccount:t.toAccount||'',type:t.type,amount:t.amount,date:t.date,note:t.note,bill:t.bill,payrollIncome:t.payrollIncome||''}})}
function balanceAt(id,date){
  var a=S.accounts[id]; if(!a) return null;
  if(date&&date<a.asOf) return null;
  var b=a.opening||0;
  allTx().forEach(function(t){
    if(t.date<a.asOf) return;
    if(date&&t.date>date) return;
    if(t.account===id)b+=t.type==='deposit'?t.amount:-t.amount;
    else if(t.type==='transfer'&&t.toAccount===id)b+=t.amount;
  });
  return r2(b);
}
function acctList(){return Object.keys(S.accounts).map(function(id){return Object.assign({id:id},S.accounts[id])}).sort(function(a,b){return (a.order||0)-(b.order||0)})}
function totalBalance(date){return r2(acctList().filter(function(a){return a.inTotal}).reduce(function(t,a){var b=balanceAt(a.id,date);return t+(b==null?0:b)},0))}
function defaultCutoff(k){
  var cs=S.settings.cutoffs,cur=curYM(); if(k<cur) return cs[cs.length-1]; if(k>cur) return cs[0];
  var d=new Date().getDate(); for(var i=0;i<cs.length;i++) if(Math.min(cs[i].day,daysIn(k))>=d) return cs[i]; return cs[cs.length-1];
}
function activeCutoff(k){var cs=S.settings.cutoffs;if(ui.cutoff&&cs.some(function(c){return c.id===ui.cutoff}))return ui.cutoff;return defaultCutoff(k).id}

function kindLabel(k){return {bank:'Bank',ewallet:'E-wallet',cash:'Cash'}[k]||'Account'}
function storageNote(){return ui.mode==='local'?'Saved in this browser only.':'Saved automatically to your own private ledger. Nobody else can see it.'}
function cutoffPoints(){
  var pts=[],today=todayStr(),starts=acctList().map(function(a){return a.asOf}).sort();
  if(!starts.length) return pts;
  var first=starts[0].slice(0,7),last=shiftYM(curYM(),0),k=first;
  while(k<=last&&pts.length<24){
    S.settings.cutoffs.forEach(function(c){var d=cutoffDate(k,c.day);if(d<=today&&d>=starts[0])pts.push({d:d,l:shortDate(d)})});
    k=shiftYM(k,1);
  }
  return pts.slice(-10);
}
function balanceSeries(){return cutoffPoints().map(function(p){return{l:p.l,v:totalBalance(p.d)}})}

/* ---------- charts ---------- */
function niceMax(v){if(v<=0)return 1000;var p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p,n=f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10;return n*p}
function axisLabel(v){return '₱'+(v>=1000?(Math.round(v/100)/10)+'k':Math.round(v))}
function lineChart(pts,W){
  if(!pts.length) return '<div class="empty">Add an account to see your balance over time.</div>';
  var H=220,L=50,R=16,T=16,B=30,max=niceMax(Math.max.apply(null,pts.map(function(p){return p.v}).concat([1])));
  var x=function(i){return pts.length===1?L+(W-L-R)/2:L+i*(W-L-R)/(pts.length-1)},y=function(v){return T+(H-T-B)*(1-v/max)};
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="Total balance at each cutoff, latest '+money(pts[pts.length-1].v)+'">';

  confirmClick(btn,function(){
    Object.keys(S.tx).forEach(function(t){if(S.tx[t].account===id||S.tx[t].toAccount===id)delDoc('tx',t)});
    Object.keys(S.months).forEach(function(k){var m=clone(S.months[k]),ch=false;(m.items||[]).forEach(function(i){if(i.account===id){i.account='';ch=true}});if(ch)setDoc('months',k,m)});
    delDoc('accounts',id);closeModal();toast('Account deleted');
  });
}

/* ---------- goals ---------- */
var goalCtx=null;
function openGoal(id){
  var g=id?S.goals[id]:null;goalCtx={id:id||null};
  openModal('<form id="goal-form" novalidate><label class="f">Goal name<input class="in" id="g-name" maxlength="50" placeholder="e.g. Emergency fund" value="'+esc(g?g.name:'')+'"></label><div class="row2"><label class="f">Target'+amtField('g-target',g?g.target:'')+'</label><label class="f">Saved so far'+amtField('g-saved',g?g.saved:'')+'</label></div><div class="err" id="f-err" role="alert" hidden></div><div class="acts">'+(g?'<button type="button" class="btn danger sp" data-act="goal-del">Delete</button>':'')+'<button type="button" class="btn" data-act="close">Cancel</button><button type="submit" class="btn pri">'+(g?'Save':'Add goal')+'</button></div></form>',g?'Edit goal':'New savings goal');
}
function submitGoal(){
  var n=val('g-name').trim(),t=parseAmount(val('g-target')),sv=parseAmount(val('g-saved')||'0',true);
  if(!n)return formErr('Enter a goal name.','g-name');
  if(t==null)return formErr('Enter a target greater than zero.','g-target');
  if(sv==null)return formErr('Saved so far must be a number, like 0 or 1,500.','g-saved');
  var id=goalCtx.id||uid(),old=S.goals[id];setDoc('goals',id,{name:n,target:t,saved:sv,order:old?old.order:Date.now()});closeModal();toast(old?'Saved':'Goal added');
}
function openContrib(id){
  var g=S.goals[id];if(!g)return;goalCtx={id:id};
  openModal('<form id="contrib-form" novalidate><div class="f" style="display:flex;flex-direction:column;gap:5px"><b style="font-size:.9rem;font-weight:500">Action</b>'+segHtml('ca',[['add','Add money'],['take','Take out']],'add')+'</div><label class="f">Amount'+amtField('c-amt','')+'</label><p class="sub">Now '+money(g.saved)+' of '+money(g.target)+'.</p><div class="err" id="f-err" role="alert" hidden></div><div class="acts"><button type="button" class="btn" data-act="close">Cancel</button><button type="submit" class="btn pri">Save</button></div></form>','Update '+g.name);
}
function submitContrib(){
  var g=S.goals[goalCtx.id],a=parseAmount(val('c-amt'));if(!g)return;
  if(a==null)return formErr('Enter an amount greater than zero.','c-amt');
  var take=radio('ca')==='take';if(take&&a>g.saved+0.004)return formErr('Only '+money(g.saved)+' is saved in this goal.','c-amt');
  var ng=Object.assign({},g,{saved:r2(Math.max(0,g.saved+(take?-a:a)))});setDoc('goals',goalCtx.id,ng);closeModal();
  toast(ng.saved>=ng.target&&g.saved<g.target?'Goal reached: '+g.name:'Saved · '+money(ng.saved)+' of '+money(ng.target));
}
/* ---------- backup ---------- */
async function exportBackup(){
  if(!downloadsNs){toast('Saving files is not available in this view');return}
  var o={app:'payday-ledger',version:1,exported:todayStr(),settings:S.settings,accounts:S.accounts,months:S.months,tx:S.tx,goals:S.goals};
  try{await downloadsNs.save({filename:'payday-ledger-backup-'+todayStr()+'.json',data:JSON.stringify(o,null,2)});toast('Backup ready')}
  catch(e){if(!e||e.code!=='declined')toast('Could not save the backup')}
}
var pendingImport=null;
function readBackup(file){
  if(!file)return;
  if(file.size>5e6){toast('That file is too large to be a backup');return}
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var o=JSON.parse(String(fr.result));
      if(!o||o.app!=='payday-ledger'||typeof o.accounts!=='object'||typeof o.months!=='object')throw 0;
      var clean={settings:normSettings(o.settings),accounts:{},months:{},tx:{},goals:{}};
      var payrollAssigned=false;
      Object.keys(o.accounts||{}).forEach(function(id){var a=o.accounts[id];if(a&&typeof a.name==='string'&&isFinite(a.opening)&&validDate(a.asOf)){var payroll=!!a.payroll&&!payrollAssigned;if(payroll)payrollAssigned=true;clean.accounts[id]={name:a.name.slice(0,40),kind:['bank','ewallet','cash'].indexOf(a.kind)>=0?a.kind:'bank',opening:Number(a.opening),asOf:a.asOf,inTotal:a.inTotal!==false,payroll:payroll,earmarks:(Array.isArray(a.earmarks)?a.earmarks:[]).filter(function(e){return e&&typeof e.label==='string'&&isFinite(e.amount)}).map(function(e){return{id:String(e.id||uid()),label:e.label.slice(0,40),amount:Number(e.amount)}}),order:Number(a.order)||0,bg:cleanBg(a.bg)}}});
      Object.keys(o.months||{}).forEach(function(k){var m=o.months[k];if(validYM(k)&&m)clean.months[k]={income:(Array.isArray(m.income)?m.income:[]).filter(function(x){return x&&isFinite(x.amount)&&typeof x.label==='string'}).map(function(x){return{id:String(x.id||uid()),label:x.label.slice(0,40),kind:x.kind==='deduction'?'deduction':'income',amount:Number(x.amount),cutoff:String(x.cutoff)}}),items:(Array.isArray(m.items)?m.items:[]).filter(function(x){return x&&isFinite(x.amount)&&typeof x.name==='string'&&['needs','wants','savings'].indexOf(x.group)>=0}).map(function(x){return{id:String(x.id||uid()),name:x.name.slice(0,60),amount:Number(x.amount),group:x.group,cutoff:String(x.cutoff),paid:!!x.paid,paidOn:x.paid&&validDate(x.paidOn)?x.paidOn:null,account:clean.accounts[x.account]?x.account:''}})}});
      Object.keys(o.tx||{}).forEach(function(id){var t=o.tx[id],transfer=t&&t.type==='transfer';if(t&&clean.accounts[t.account]&&isFinite(t.amount)&&validDate(t.date)&&((t.type==='deposit'||t.type==='withdraw')||transfer&&clean.accounts[t.toAccount]&&t.toAccount!==t.account))clean.tx[id]={account:t.account,toAccount:transfer?t.toAccount:'',type:t.type,amount:Number(t.amount),date:t.date,note:String(t.note||'').slice(0,80),bill:t.bill?String(t.bill):null,payrollIncome:typeof t.payrollIncome==='string'?t.payrollIncome:''}});
      Object.keys(o.goals||{}).forEach(function(id){var g=o.goals[id];if(g&&typeof g.name==='string'&&isFinite(g.target)&&isFinite(g.saved))clean.goals[id]={name:g.name.slice(0,50),target:Number(g.target),saved:Number(g.saved),order:Number(g.order)||0}});
      pendingImport=clean;
      openModal('<p>This backup has <b>'+Object.keys(clean.accounts).length+' account(s)</b>, <b>'+Object.keys(clean.months).length+' month(s)</b> and <b>'+Object.keys(clean.goals).length+' goal(s)</b>. Restoring replaces everything in your ledger now.</p><div class="acts" style="margin-top:12px"><button type="button" class="btn" data-act="close">Cancel</button><button type="button" class="btn pri" data-act="import-go">Replace my ledger</button></div>','Restore this backup?');
    }catch(err){toast('That file is not a Payday Ledger backup')}
  };
  fr.readAsText(file);
}
function applyImport(){
  var c=pendingImport;if(!c)return;
  ['accounts','months','tx','goals'].forEach(function(k){Object.keys(S[k]).forEach(function(id){if(!c[k][id])delDoc(k,id)});S[k]=c[k]});
  S.settings=c.settings;persistAll();closeModal();pendingImport=null;toast('Backup restored');
}

/* ---------- settings actions ---------- */
function copyPrev(){
  var pk=shiftYM(ui.month,-1),pm=getMonth(pk),m={income:pm.income.map(function(x){return Object.assign({},x,{id:uid()})}),items:pm.items.map(function(x){return Object.assign({},x,{id:uid(),paid:false,paidOn:null})})};
  setDoc('months',ui.month,m);toast('Copied from '+ymLabel(pk)+'. Update the amounts that changed.');
}
function setMonth(k){ui.month=k;ui.cutoff=null;saveUi();render()}
function saveUi(){try{localStorage.setItem(LS_UI,JSON.stringify({month:ui.month,theme:ui.theme}))}catch(e){}}
var initialTheme=document.documentElement.getAttribute('data-theme');
function applyTheme(){var r=document.documentElement;if(ui.theme==='light'||ui.theme==='dark')r.setAttribute('data-theme',ui.theme);else if(initialTheme)r.setAttribute('data-theme',initialTheme);else r.removeAttribute('data-theme')}
function setTheme(t){ui.theme=t;saveUi();applyTheme();render()}
function nextPayday(){
  var t=todayStr(),best=null;
  for(var i=0;i<2;i++){var mk=shiftYM(curYM(),i);S.settings.cutoffs.forEach(function(c){var d=cutoffDate(mk,c.day);if(d>=t&&(!best||d<best.d))best={d:d,day:c.day}})}
  if(best)best.n=Math.round((new Date(best.d+'T00:00:00')-new Date(t+'T00:00:00'))/864e5);
  return best;
}
function cutoffUsed(id){return Object.keys(S.months).some(function(k){var m=S.months[k];return (m.items||[]).some(function(i){return i.cutoff===id})||(m.income||[]).some(function(i){return i.cutoff===id})})}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;var a=t.dataset.act,d=t.dataset;
  if(isLocked()&&['prof-switch','prof-add','theme-cycle','prof-erase','close','month-prev','month-next','month-now','pw-mode'].indexOf(a)<0)return;
  switch(a){
    case 'pw-mode':profCtx.pwMode=d.m;$('#pw-wrap').innerHTML=d.m?pwFields(d.m):pwSection(profCtx.id?P.list.filter(function(x){return x.id===profCtx.id})[0]:null);var pf=$('#p-cur')||$('#p-pw');if(pf)pf.focus();break;
    case 'prof-erase':eraseActive(t);break;
    case 'month-prev':setMonth(shiftYM(ui.month,-1));break;
    case 'month-next':setMonth(shiftYM(ui.month,1));break;
    case 'month-now':setMonth(curYM());break;
    case 'goto-month':ui.month=d.k;ui.cutoff=null;saveUi();location.hash='#bills';render();break;
    case 'cutoff-tab':ui.cutoff=d.id;render();break;
    case 'toggle':togglePaid(d.k,d.id);break;
    case 'quick':openEntry({type:'expense'});break;
    case 'add':openEntry({type:d.type,group:d.group,cutoff:d.cutoff});break;
    case 'tab':openEntry({type:d.type,mtype:d.mtype},true);break;
    case 'edit-item':openEntry({editItem:{k:d.k,id:d.id}});break;
    case 'edit-income':openEntry({editIncome:{k:d.k,id:d.id}});break;
    case 'edit-tx':openEntry({editTx:d.id});break;
    case 'move':openEntry({type:'move',account:d.acct,mtype:d.mtype});break;
    case 'modal-del':modalDelete(t);break;
    case 'close':closeModal();break;
    case 'theme-cycle':setTheme({system:'light',light:'dark',dark:'system'}[ui.theme]);break;
    case 'load-sample':loadSample();break;
    case 'goal-add':openGoal();break;
    case 'goal-edit':openGoal(d.id);break;
    case 'goal-contrib':openContrib(d.id);break;
    case 'goal-del':confirmClick(t,function(){delDoc('goals',goalCtx.id);closeModal();toast('Goal deleted')});break;
    case 'export':exportBackup();break;
    case 'import':$('#imp').click();break;
    case 'import-go':applyImport();break;
    case 'reset':confirmClick(t,function(){wipeAll();toast('Your ledger was erased')});break;
    case 'copy-prev':copyPrev();break;
    case 'acct-add':openAccount();break;
    case 'acct-edit':openAccount(d.id);break;
    case 'acct-bg':openBg(d.id);break;
    case 'bg-upload':$('#bg-file').click();break;
    case 'bg-pick':bgCtx.sel=d.id==='none'?null:{type:'color',id:d.id};bgPreview();break;
    case 'bg-save':{var ba=S.accounts[bgCtx.id];if(ba){setDoc('accounts',bgCtx.id,Object.assign({},ba,{bg:bgCtx.sel}));toast('Card background saved')}closeModal();break}
    case 'prof-switch':switchProfile(d.id);break;
    case 'prof-add':openProfile(false);break;
    case 'prof-edit':openProfile(true);break;
    case 'prof-del':deleteProfile(t);break;
    case 'acct-del':deleteAccount(t);break;
    case 'em-add':$('#em-list').insertAdjacentHTML('beforeend',emRow());break;
    case 'em-del':t.closest('.em-row').remove();break;
    case 'confirm-rules':S.settings.confirmedTotal=rulingTotal();saveSettings();toast('Kept at '+rulingTotal()+'%');break;
    case 'cat-del':S.settings.cats[d.g].splice(Number(d.i),1);saveSettings();break;
    case 'cut-add':
      var used=S.settings.cutoffs.map(function(c){return c.day}),day=[10,20,25,5,1,28].filter(function(x){return used.indexOf(x)<0})[0]||2,n=1;
      while(S.settings.cutoffs.some(function(c){return c.id==='c'+n}))n++;
      S.settings.cutoffs.push({id:'c'+n,day:day});saveSettings();break;
    case 'cut-del':
      if(cutoffUsed(d.id)){toast('That cutoff has income or bills in it. Move or delete them first.');break}
      S.settings.cutoffs=S.settings.cutoffs.filter(function(c){return c.id!==d.id});saveSettings();break;
  }
});
document.addEventListener('submit',function(e){
  var f=e.target;
  if(f.id==='entry'){e.preventDefault();submitEntry()}
  else if(f.id==='acct-form'){e.preventDefault();submitAccount()}
  else if(f.id==='goal-form'){e.preventDefault();submitGoal()}
  else if(f.id==='prof-form'){e.preventDefault();submitProfile()}
  else if(f.id==='unlock-form'){e.preventDefault();submitUnlock()}
  else if(f.id==='switch-form'){e.preventDefault();submitSwitch()}
  else if(f.id==='contrib-form'){e.preventDefault();submitContrib()}
  else if(f.dataset&&f.dataset.form==='cat'){
    e.preventDefault();var inp=f.querySelector('input'),v=inp.value.trim(),g=f.dataset.g;
    if(!v) return;if(S.settings.cats[g].some(function(x){return x.toLowerCase()===v.toLowerCase()})){toast('Already in the list');return}
    S.settings.cats[g].push(v);saveSettings();
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.name==='mt'){var toWrap=$('#f-to-wrap');if(toWrap)toWrap.hidden=radio('mt')!=='transfer';return}
  if(t.id==='bg-file'){var fl=t.files&&t.files[0];t.value='';if(fl)resizePhoto(fl).then(function(d){bgCtx.sel={type:'photo',data:d};bgPreview()},function(){formErr('That photo could not be used. Try a JPG or PNG image.')});return}
  if(t.id==='imp'){readBackup(t.files&&t.files[0]);t.value='';return}
  if(t.name==='theme'){setTheme(t.value);return}
  if(t.name==='grp'){var dl=$('#cat-list');if(dl)dl.innerHTML=catList(t.value)}
  var s=t.dataset&&t.dataset.set;if(!s)return;
  if(s==='cut-day'){
    var n=Number(t.value);
    if(!Number.isInteger(n)||n<1||n>31){toast('Enter a day from 1 to 31');t.value=S.settings.cutoffs.filter(function(c){return c.id===t.dataset.id})[0].day;return}
    if(S.settings.cutoffs.some(function(c){return c.id!==t.dataset.id&&c.day===n})){toast('Two cutoffs cannot share the same day');t.value=S.settings.cutoffs.filter(function(c){return c.id===t.dataset.id})[0].day;return}
    S.settings.cutoffs.forEach(function(c){if(c.id===t.dataset.id)c.day=n});S.settings.cutoffs.sort(function(a,b){return a.day-b.day});saveSettings();toast('Cutoff day saved');
  }else if(s==='rule'){
    var p=Number(t.value);
    if(t.value===''||!isFinite(p)||p<0||p>100){toast('Enter a percentage from 0 to 100');t.value=S.settings.ruling[t.dataset.g];return}
    S.settings.ruling[t.dataset.g]=p;saveSettings();
  }
});

/* ---------- boot ---------- */
function loadUi(){try{var o=JSON.parse(localStorage.getItem(LS_UI)||'null');if(o&&validYM(o.month))ui.month=o.month;if(o&&(o.theme==='light'||o.theme==='dark'))ui.theme=o.theme}catch(e){}applyTheme()}
function subscribe(){
  subs.forEach(function(u){try{u()}catch(e){}});subs=[];var my=++gen;
  var need=5,got={};
  function done(n){if(my!==gen)return;if(!got[n]){got[n]=1;if(Object.keys(got).length>=need){ui.loading=false;ui.slow=false}}}
  var map=function(snap){var o={};snap.docs.forEach(function(d){o[d.id]=d.data()});return o};
  var errH=function(){if(my!==gen)return;ui.loading=false;toast('Could not load your saved data');scheduleRender()};
  var base=db.doc(BASE);
  subs.push(base.collection('config').onSnapshot(function(s){if(my!==gen)return;var o=map(s);if(o.settings)S.settings=normSettings(o.settings);done('config');scheduleRender()},errH));
  ['accounts','months','tx','goals'].forEach(function(n){subs.push(base.collection(n).onSnapshot(function(s){if(my!==gen)return;S[n]=map(s);done(n);scheduleRender()},errH))});
  setTimeout(function(){if(my===gen&&ui.loading){ui.loading=false;ui.slow=true;scheduleRender()}},10000);
}
async function boot(){
  loadUi();render();
  var ns=null,user=null,cl=window.claude;
  if(cl&&typeof cl.use==='function'){
    try{ns=await cl.use('db')}catch(e){}
    try{user=await cl.use('user')}catch(e){}
    try{downloadsNs=await cl.use('downloads')}catch(e){}
  }
  var uidv=null,canW=true;
  if(ns&&user){try{uidv=await user.id()}catch(e){}try{if(user.can)canW=(await user.can('data.write'))!==false}catch(e){}}
  if(ns&&uidv&&canW){
    db=ns;UID=uidv;ui.mode='cloud';
    var act='p1';try{act=localStorage.getItem(LS_ACTIVE)||'p1'}catch(e){}
    P.list=[{id:'p1',name:'My Budget'}];P.active=act;BASE=baseFor(act);subscribe();
    db.doc(metaPath()).onSnapshot(function(sn){
      metaReady=true;
      if(sn.exists){var d=sn.data();if(d&&Array.isArray(d.list)){var l=d.list.filter(function(x){return x&&typeof x.id==='string'&&typeof x.name==='string'}).slice(0,8);if(l.length)P.list=l}}
      if(!P.list.some(function(x){return x.id===P.active})){P.active=P.list[0].id;activate(P.active);return}
      scheduleRender();
    },function(){metaReady=true;scheduleRender()});
  }
  else{ui.mode='local';loadProfiles();ui.why=!(cl&&typeof cl.use==='function')?'':(ns&&uidv&&!canW?'viewonly':'signedout');loadLocal();ui.loading=false;render()}
}
boot();
})();
</script>
